<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kavach Shield</title>
  <style>
    body { width: 310px; margin: 0; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0e12; color: #f3f4f6; }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: #fff; }
    p { font-size: 12px; color: #9ca3af; margin: 0 0 12px; line-height: 1.4; }
    .status-card { background: #181b21; border: 1px solid #27272a; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .status-left { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
    .dot.off { background: #6b7280; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(14px); }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: #d1d5db; }
    .btn { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; margin-top: 8px; cursor: pointer; border: none; width: 100%; box-sizing: border-box; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; }
    .btn-secondary:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <h1>🛡️ Kavach Live Shield</h1>
  <p>Real-time automated chat protection on WhatsApp Web and Telegram.</p>

  <div class="status-card">
    <div class="status-left">
      <span class="dot" id="live-dot"></span>
      <span id="live-text">Shield Active</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-shield" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stat-row">
    <span>Backend Connectivity:</span>
    <strong id="api-status" style="color:#10b981;">Connected</strong>
  </div>
  <div class="stat-row">
    <span>Threats Flagged:</span>
    <strong id="threat-count">0</strong>
  </div>

  <button type="button" class="btn btn-secondary" id="test-banner-btn">⚡ Scan Active Chat Now</button>
  <a class="btn" href="http://localhost:8000" target="_blank" rel="noopener">Open Kavach Safety Center ↗</a>

  <script src="popup.js"></script>
</body>
</html>
